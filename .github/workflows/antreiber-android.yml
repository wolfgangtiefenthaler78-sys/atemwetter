name: Antreiber-App (Android) bauen

# Baut die App „Antreiber“ (Ordner antreiber/) und stellt sie als GitHub-Release bereit.
# Zusätzlich das feste Release „antreiber-aktuell“ (immer neueste Version):
#   antreiber.apk  – fester Download-Link für neue Nutzer und für „Jetzt aktualisieren“
#   version.json + app.html – daraus holen installierte Apps neue Inhalte selbst
# Mit den Secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD wird sie mit dem MAYOKA-Schlüssel
# unterschrieben (dann lassen sich spätere Versionen über die alte installieren), sonst als Test-APK.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'claude/elegant-babbage-4e0k9a']
    paths: ['antreiber/**', '.github/workflows/antreiber-android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antreiber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: antreiber/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android
      - name: Schlüssel bereitstellen
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
      - name: App bauen
        working-directory: antreiber/android
        env:
          AW_KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          AW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AW_VERSION_CODE: ${{ github.run_number }}
          AW_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5; do ./gradlew --version --no-daemon && break; [ "$i" = 5 ] && exit 1; echo "Gradle-Download fehlgeschlagen, neuer Versuch in $((i*30)) s"; sleep $((i*30)); done
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../antreiber.apk
            cp app/build/outputs/bundle/release/app-release.aab ../../antreiber.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../antreiber.apk
          fi
      - name: Veröffentlichen (nicht als „neueste“, damit der Atemwetter-Link gleich bleibt)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: antreiber-1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Antreiber für Android 1.0.${{ github.run_number }}
          make_latest: false
          body: |
            Antreiber-Test (MAYOKA andersch gsund) für Android.
            Installieren: antreiber.apk am Handy herunterladen und öffnen.
          files: |
            antreiber.apk
            antreiber.aab
          fail_on_unmatched_files: false
      - name: Feste Update-Adresse „antreiber-aktuell“ erneuern
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete antreiber-aktuell --cleanup-tag -y || true
          gh release create antreiber-aktuell antreiber.apk antreiber/dist/version.json antreiber/dist/app.html \
            --target "${{ github.sha }}" --latest=false \
            --title "Antreiber – immer die neueste Version" \
            --notes "Fester Link zur neuesten Antreiber-App (1.0.${{ github.run_number }}). Installierte Apps holen sich Neuerungen hier selbst."
