name: Morgen-Mitteilungen (Browser)

# Der regelmäßige Versand läuft NICHT mehr hier, sondern in Supabase: pg_cron ruft alle 10 Minuten die
# Edge Function „send-push“ auf (supabase/functions/send-push, Migration 20261109100000_push_cron.sql).
# Grund: Die GitHub-Zeitsteuerung lief verspätet oder gar nicht.
# Dieser Workflow bleibt für Hand-Starts: Schlüsselpaar anlegen (setup) oder ausnahmsweise nachsenden.
on:
  workflow_dispatch:
    inputs:
      setup:
        description: 'Nur Schlüssel anlegen (ohne Versand)'
        type: boolean
        default: false

concurrency: push

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node scripts/send_push.mjs ${{ inputs.setup && '--setup' || '' }}
