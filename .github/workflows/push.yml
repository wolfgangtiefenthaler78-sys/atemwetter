name: Morgen-Mitteilungen (Browser)

# Verschickt den Tagestipp an Browser, in denen „Jeden Morgen als Mitteilung“ eingeschaltet ist.
# Läuft am Morgen alle 30 Minuten; jede Anmeldung bekommt höchstens eine Mitteilung pro Tag,
# sobald ihre gewählte Uhrzeit (Wien) erreicht ist. Android- und iPhone-App planen ihre Mitteilungen selbst.
on:
  schedule:
    - cron: '7,37 4-9 * * *'   # 05:07–10:37 Wien im Winter, 06:07–11:37 im Sommer
  workflow_dispatch:
    inputs:
      setup:
        description: 'Nur Schlüssel anlegen (ohne Versand)'
        type: boolean
        default: false

concurrency: push

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node scripts/send_push.mjs ${{ inputs.setup && '--setup' || '' }}
