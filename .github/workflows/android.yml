name: Android-Test-APK bauen

on:
  workflow_dispatch:
  push:
    tags: ['android-*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android
      - name: APK bauen
        working-directory: android
        run: |
          for i in 1 2 3 4 5; do ./gradlew --version --no-daemon && break; [ "$i" = 5 ] && exit 1; echo "Gradle-Download fehlgeschlagen, neuer Versuch in $((i*30)) s"; sleep $((i*30)); done
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Atemwetter-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
